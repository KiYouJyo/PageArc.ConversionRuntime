name: Release conversion runtime

on:
  workflow_dispatch:
  push:
    branches:
      - publish/runtime-9.13.0-pagearc.1

permissions:
  contents: write

concurrency:
  group: pagearc-conversion-runtime-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Build pinned runtime package
        shell: pwsh
        run: |
          .\eng\build-runtime.ps1 -Version '9.13.0' -PackageVersion '9.13.0-pagearc.1' -OutputDirectory artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate package contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content artifacts\runtime-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.packageVersion -cne '9.13.0-pagearc.1') { throw 'Package version mismatch.' }
          if ($manifest.architecture -cne 'x64') { throw 'Architecture mismatch.' }
          $zip = Resolve-Path artifacts\PageArc.ConversionRuntime-win-x64.zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -cne $manifest.sha256) { throw 'Runtime SHA mismatch.' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $entry = $archive.Entries | Where-Object FullName -eq 'runtime/ebook-convert.exe' | Select-Object -First 1
            if (-not $entry -or $entry.Length -eq 0) { throw 'Runtime archive is missing ebook-convert.exe.' }
          } finally { $archive.Dispose() }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PageArc.ConversionRuntime-9.13.0-pagearc.1
          path: artifacts
          retention-days: 30
          compression-level: 0

      - name: Publish pinned runtime release
        if: github.event_name == 'push' && github.ref == 'refs/heads/publish/runtime-9.13.0-pagearc.1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v9.13.0-pagearc.1'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag artifacts\* --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Runtime release upload failed.' }
          } else {
            gh release create $tag artifacts\* --target $env:GITHUB_SHA --title 'PageArc Conversion Runtime 9.13.0-pagearc.1' --notes 'Pinned calibre 9.13.0 Windows x64 conversion runtime for PageArc v1.4+.'
            if ($LASTEXITCODE -ne 0) { throw 'Runtime release creation failed.' }
          }
